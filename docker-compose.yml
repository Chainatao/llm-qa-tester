services:
  llm-qa-tester:
    image: ghcr.io/chainatao/llm-qa-tester:latest
    container_name: llm-qa-tester
    restart: unless-stopped

    environment:
      LLM_QA_ENDPOINT: ${LLM_QA_ENDPOINT}
      LLM_QA_SECRET: ${LLM_QA_SECRET}
      TESTER_UI_PASSWORD: ${TESTER_UI_PASSWORD}
      TESTER_SESSION_SECRET: ${TESTER_SESSION_SECRET}
      TESTER_SESSION_DAYS: ${TESTER_SESSION_DAYS:-30}
      TESTER_COOKIE_SECURE: ${TESTER_COOKIE_SECURE:-true}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}

    networks:
      - traefik

    labels:
      - "traefik.enable=true"
      # HTTP → HTTPS redirect (required for Let's Encrypt HTTP-01 challenge on port 80)
      - "traefik.http.routers.llm-qa-tester-http.rule=Host(`llm-qa-tester.acion.es`)"
      - "traefik.http.routers.llm-qa-tester-http.entrypoints=web"
      - "traefik.http.routers.llm-qa-tester-http.middlewares=llm-qa-tester-https-redirect"
      - "traefik.http.middlewares.llm-qa-tester-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.llm-qa-tester-https-redirect.redirectscheme.permanent=true"
      # HTTPS
      - "traefik.http.routers.llm-qa-tester.rule=Host(`llm-qa-tester.acion.es`)"
      - "traefik.http.routers.llm-qa-tester.entrypoints=websecure"
      - "traefik.http.routers.llm-qa-tester.tls=true"
      - "traefik.http.routers.llm-qa-tester.tls.certresolver=myresolver"
      - "traefik.http.services.llm-qa-tester.loadbalancer.server.port=8000"

networks:
  traefik:
    external: true
